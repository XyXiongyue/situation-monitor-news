                <p>中国是唯一一个进行大规模煤制天然气生产的国家，到2030年，产能将增加近两倍，从今年的9.4亿立方米增加到280亿立方米。</p>
                <p>新疆廉价的矿井口煤生产的天然气价格为每MMBtu 9.1至9.6美元，总体上低于中国液化天然气平均进口价格。</p>
                <p>里斯塔德表示，从澳大利亚到卡塔尔再到美国的液化天然气出口商需要将煤制天然气视为对中国进口需求的结构性损害，而不是脚注。</p>
